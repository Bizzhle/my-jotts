name: Production CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "Deploying to production over SSH..."

            cd /root/app/my-jotts

            echo "Fetching latest main..."
            git fetch origin main

            echo "Validating required environment variables..."

            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT

            git show origin/main:portal-backend/src/envvars.ts |
              sed -n '/interface EnvVars/,/^}/p' |
              sed -E 's/^[[:space:]]*([A-Z][A-Z0-9_]*)[[:space:]]*:.*/\1/' |
              grep -E '^[A-Z][A-Z0-9_]*$' |
              sort -u > "$temp_dir/backend.incoming"

            git show origin/main:frontend/src/config/envvars.ts |
              sed -n '/type Envvars/,/^}/p' |
              sed -E 's/^[[:space:]]*([A-Z][A-Z0-9_]*)[[:space:]]*:.*/\1/' |
              grep -E '^[A-Z][A-Z0-9_]*$' |
              sort -u > "$temp_dir/frontend.incoming"

            sed -E 's/[[:space:]]*#.*$//; s/[[:space:]]*=.*$//' .env |
              grep -E '^[A-Z][A-Z0-9_]*$' |
              sort -u > "$temp_dir/backend.existing"

            sed -E 's/[[:space:]]*#.*$//; s/[[:space:]]*=.*$//' frontend/.env |
              grep -E '^[A-Z][A-Z0-9_]*$' |
              sort -u > "$temp_dir/frontend.existing"

            backend_missing="$(comm -23 "$temp_dir/backend.incoming" "$temp_dir/backend.existing" || true)"
            frontend_missing="$(comm -23 "$temp_dir/frontend.incoming" "$temp_dir/frontend.existing" || true)"

            if [ -n "$backend_missing" ] || [ -n "$frontend_missing" ]; then
              echo "::error::Required environment variables are missing from the VPS."
              [ -n "$backend_missing" ] && printf 'Backend missing:\n%s\n' "$backend_missing"
              [ -n "$frontend_missing" ] && printf 'Frontend missing:\n%s\n' "$frontend_missing"
              exit 1
            fi

            echo "Environment validation passed."

            echo "Proceeding with deployment..."

            git log -1 --oneline origin/main

            git pull --ff-only origin main
            
            if [ -d traefik/acme.json ]; then
              if ! rmdir traefik/acme.json; then
                echo "::error::traefik/acme.json is a non-empty directory."
                exit 1
              fi
            fi
            [ -e traefik/acme.json ] || touch traefik/acme.json
            if [ ! -f traefik/acme.json ]; then
              echo "::error::traefik/acme.json must be a regular file."
              exit 1
            fi

            chmod 600 traefik/acme.json
            echo "Validating Docker Compose configuration..."

            docker compose -f docker-compose.yml config -q
            docker compose -f docker-compose.yml up -d --build --remove-orphans
            echo "Deployment complete."